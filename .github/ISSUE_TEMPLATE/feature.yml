name: Feature / change
description: New play, Lab, UX, or infra work
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues should meet **Definition of Ready** before Evander / Grok Build starts. A Ready issue is the prompt: human-readable and AI-executable.
        DoR: [docs/ai-team/00-README-Ways-of-Working.md](https://github.com/diagonalcounty/heliopoly/blob/main/docs/ai-team/00-README-Ways-of-Working.md#3-definition-of-ready-dor)
        **Swithin** owns the DoR gate. Evander builds only Ready work.
  - type: textarea
    id: summary
    attributes:
      label: Desired outcome (human-readable)
      description: What should players / ops be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Problem or opportunity (not the implementation).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (testable)
      placeholder: |
        - [ ] …
        - [ ] HITL on preview.heliopoly.live if player-facing
    validations:
      required: true
  - type: dropdown
    id: human_testing
    attributes:
      label: Human testing required?
      options:
        - "Yes — preview.heliopoly.live HITL before Done"
        - "No — automated / obvious non-UI"
      default: 0
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      value: none
    validations:
      required: true
  - type: textarea
    id: spacex
    attributes:
      label: SpaceX 5-step (brief)
      description: Delete? Simplify? Accelerate? Or N/A with one line why.
    validations:
      required: true
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready (author checklist)
      options:
        - label: Clear outcome written above
          required: true
        - label: Acceptance criteria are explicit and testable
          required: true
        - label: Dependencies logged (or “none”)
          required: true
        - label: Human-testing flag set
          required: true
        - label: Sized for one focused Grok Build chat (or a clear subset)
          required: true
        - label: Issue body is the Build prompt (human- and AI-readable; no second rewrite needed)
          required: true
        - label: SpaceX 5-step noted above
          required: true
